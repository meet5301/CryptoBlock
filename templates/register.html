<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>CryptoFusion | Register</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
  min-height:100vh;display:flex;align-items:center;
  justify-content:flex-start;padding-left:12%;
  font-family:"Segoe UI",Inter,system-ui;color:white;
  background:
    linear-gradient(rgba(255,255,255,0.06) 1px,transparent 1px),
    linear-gradient(90deg,rgba(255,255,255,0.06) 1px,transparent 1px),
    #0a1f44;
  background-size:42px 42px;
  animation:gridMove 20s linear infinite;
}
@keyframes gridMove{from{background-position:0 0,0 0}to{background-position:80px 80px,80px 80px}}
body::after{
  content:"";position:fixed;top:-20%;right:-10%;width:60%;height:140%;
  background:radial-gradient(circle,rgba(250,204,21,0.25),transparent 65%);
  pointer-events:none;
}
.card{
  position:relative;z-index:2;width:400px;padding:38px 34px;border-radius:18px;
  background:rgba(255,255,255,.06);backdrop-filter:blur(160px);
  border:1px solid rgba(255,255,255,.14);
  box-shadow:0 0 0 1px rgba(250,204,21,.12),0 20px 50px rgba(0,0,0,.45);
  text-align:center;animation:popIn .4s ease;
}
@keyframes popIn{from{opacity:0;transform:scale(.95)}to{opacity:1;transform:scale(1)}}
.card h2{font-size:30px;margin-bottom:22px;color:#facc15;letter-spacing:1px;text-shadow:0 0 12px rgba(250,204,21,.45)}
.card input{
  width:100%;padding:14px 18px;margin-bottom:16px;border-radius:999px;
  border:1px solid rgba(255,255,255,.25);background:#020617;color:white;
  font-size:14px;outline:none;
}
.card input::placeholder{color:#94a3b8}
.card input:focus{border-color:#facc15;box-shadow:0 0 10px rgba(250,204,21,.25)}
.card button{
  width:100%;margin-top:6px;padding:14px;border-radius:999px;border:none;
  cursor:pointer;font-weight:900;font-size:15px;color:#0a1f44;background:#facc15;transition:.3s;
}
.card button:hover{transform:translateY(-2px);box-shadow:0 0 22px rgba(250,204,21,.45)}
.login-link{margin-top:18px;font-size:14px;color:#94a3b8}
.login-link a{color:#facc15;text-decoration:none;font-weight:700}
.login-link a:hover{text-decoration:underline}
.error{color:#ef4444;font-size:13px;margin-bottom:14px;padding:10px 14px;
  background:rgba(239,68,68,.1);border-radius:10px;border:1px solid rgba(239,68,68,.3)}
</style>
</head>
<body>
<div class="card">
  <h2>Create Account</h2>
  {% if error %}
  <div class="error">{{ error }}</div>
  {% endif %}
  <form method="post">
    <input name="name" placeholder="Full Name" required>
    <input name="email" type="email" placeholder="Email" required>
    <input name="password" type="password" placeholder="Password" required>
    <button type="submit">Register</button>
  </form>
  <div class="login-link">Already have an account? <a href="/login">Login</a></div>
</div>
</body>
</html>
