<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>CryptoFusion | Send Transaction</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
  min-height:100vh;display:flex;align-items:center;justify-content:center;
  font-family:"Segoe UI",Inter,system-ui;color:white;
  background:
    linear-gradient(rgba(255,255,255,0.06) 1px,transparent 1px),
    linear-gradient(90deg,rgba(255,255,255,0.06) 1px,transparent 1px),
    #0a1f44;
  background-size:42px 42px;
  animation:gridMove 20s linear infinite;
}
@keyframes gridMove{from{background-position:0 0,0 0}to{background-position:80px 80px,80px 80px}}
body::after{
  content:"";position:fixed;top:-20%;right:-10%;width:60%;height:140%;
  background:radial-gradient(circle,rgba(250,204,21,0.18),transparent 65%);
  pointer-events:none;
}
.card{
  position:relative;z-index:2;width:440px;
  padding:38px 34px;border-radius:20px;
  background:rgba(255,255,255,.06);backdrop-filter:blur(160px);
  border:1px solid rgba(255,255,255,.14);
  box-shadow:0 0 0 1px rgba(250,204,21,.12),0 20px 50px rgba(0,0,0,.45);
}
h2{font-size:28px;font-weight:900;color:#facc15;margin-bottom:6px;
  text-shadow:0 0 12px rgba(250,204,21,.4)}
.sub{color:#94a3b8;font-size:13px;margin-bottom:26px}
label{display:block;font-size:13px;color:#94a3b8;margin-bottom:6px}
input{
  width:100%;padding:13px 16px;margin-bottom:18px;
  border-radius:12px;border:1px solid rgba(255,255,255,.2);
  background:rgba(255,255,255,.06);color:white;font-size:14px;outline:none;
}
input:focus{border-color:#facc15;box-shadow:0 0 10px rgba(250,204,21,.25)}
input::placeholder{color:#64748b}
button{
  width:100%;padding:14px;border-radius:999px;border:none;
  background:#facc15;color:#0a1f44;font-weight:900;font-size:15px;
  cursor:pointer;transition:.3s;
}
button:hover{transform:translateY(-2px);box-shadow:0 0 22px rgba(250,204,21,.45)}
.error{color:#ef4444;font-size:13px;margin-bottom:14px;
  background:rgba(239,68,68,.1);padding:10px 14px;border-radius:10px;
  border:1px solid rgba(239,68,68,.3)}
.info{margin-top:18px;font-size:13px;color:#64748b;text-align:center}
.info a{color:#facc15;text-decoration:none}
</style>
</head>
<body>
<div class="card">
  <h2>Send Transaction</h2>
  <p class="sub">Transfer blockchain balance to another wallet</p>

  {% if error %}
  <div class="error">{{ error }}</div>
  {% endif %}

  <form method="POST">
    <label>Receiver Wallet Address</label>
    <input name="receiver" placeholder="0x..." required>
    <label>Amount</label>
    <input name="amount" type="number" min="1" placeholder="Enter amount" required>
    <button type="submit">Send ➜</button>
  </form>
  <div class="info"><a href="{{ url_for('home') }}">← Back to Home</a></div>
</div>
</body>
</html>
